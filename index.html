<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alia 3</title>
<style>
:root{--bg:#f2f6f5;--cd:#fff;--tx:#14211f;--mu:#667585;--bd:#e0e5ea;--pr:#0f766e;--g:#16a34a;--r:#dc2626;--y:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0f1519;--cd:#182128;--tx:#e8eef3;--mu:#92a1ae;--bd:#2a3640;--pr:#2dd4bf;--g:#4ade80;--r:#f87171;--y:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,#0f766e,#14a899);color:#fff;padding:20px 16px 24px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:21px}header small{opacity:.9}header select{float:left;background:#ffffff30;color:#fff;border:0;border-radius:8px;padding:6px 8px;font-family:inherit;cursor:pointer}header select option{color:#14211f}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.cd{background:var(--cd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0000000f,0 4px 14px #0000000a}
h2{font-size:16px;margin:0 0 10px}.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kp .cd{margin:0}
.hero{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#14a899);color:#fff}.kp .hero small{color:#ffffffd9}.big{font-size:30px;font-weight:700;margin-top:4px}
.kp small{font-size:12px;color:var(--mu)}.kp .v{font-size:21px;font-weight:700;margin-top:4px}
.ch{display:flex;gap:6px;align-items:flex-end;height:120px}.ch>div{flex:1;text-align:center;font-size:10px;color:var(--mu)}.bars{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100px}.bars i{display:block;width:42%;min-height:2px;border-radius:3px 3px 0 0}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row .f{flex:1;min-width:0}.row small{display:block;color:var(--mu)}
.pb{height:9px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;border-radius:6px}
.note{background:#fef3c7;color:#78350f;border-radius:14px;padding:12px;margin-bottom:12px;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.grid div{border-radius:10px;color:#fff;text-align:center;padding:9px 0;font-weight:700}.grid small{display:block;font-weight:400;font-size:10px}
input,button.b{font-family:inherit;font-size:15px;padding:11px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx)}button.b{background:var(--pr);color:#fff;border:0;cursor:pointer}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;background:var(--c)}
.upd{text-align:center;color:var(--mu);font-size:12px;margin-top:6px}
</style></head><body><header><select id="lb"></select><h1 id="ti"></h1><small id="su"></small></header><main id="app"><div class="cd">…</div></main>
<script>

var T={ar:{up:"آخر تحديث",bal:"الرصيد الحالي",paid:"أدّت هذا الشهر",inc:"مداخيل الشهر",exp:"مصاريف الشهر",ser:"المداخيل والمصاريف (12 شهراً)",cat:"المصاريف حسب الفئة (السنة الحالية)",bud:"الميزانية مقابل المنصرف",rec:"آخر المصاريف",tsk:"الصيانة القادمة",elev:"الفحص الشهري للمصعد يوم",pay:"كيفية الأداء",fee:"الواجب الشهري",lock:"تفاصيل المصاريف ووضعية الأداء بأرقام الشقق",grid:"وضعية الأداء بأرقام الشقق",pw:"كلمة السر",open:"فتح",bad:"كلمة السر خاطئة",none:"لا توجد بيانات",ok:"أدّت",late:"متأخرة",part:"جزئي",ex:"معفاة",lm:"تأخر",mo:"أشهر",err:"تعذّر تحميل المعطيات",soon:"سيتم نشر المعطيات قريباً",toggle:"Français",mine:"حسابي",apt:"رقم الشقة",code:"الكود الشخصي",bad2:"رقم الشقة أو الكود غير صحيح",owedl:"المتبقي عليك",allok:"كل أشهرك مؤداة ✅",latel:"الأشهر المتأخرة",hist:"آخر 12 شهراً",pays:"آخر دفعاتك",leave:"إغلاق",left:"الباقي",unit:"شقة",month:["يناير","فبراير","مارس","أبريل","ماي","يونيو","يوليوز","غشت","شتنبر","أكتوبر","نونبر","دجنبر"],cur:"د.م"},
fr:{up:"Dernière mise à jour",bal:"Solde actuel",paid:"Ont payé ce mois",inc:"Recettes du mois",exp:"Dépenses du mois",ser:"Recettes et dépenses (12 mois)",cat:"Dépenses par catégorie (année en cours)",bud:"Budget et dépenses réelles",rec:"Dernières dépenses",tsk:"Prochains entretiens",elev:"Contrôle mensuel de l'ascenseur le",pay:"Modalités de paiement",fee:"Cotisation mensuelle",lock:"Détail des dépenses et situation des paiements par appartement",grid:"Situation des paiements par appartement",pw:"Mot de passe",open:"Ouvrir",bad:"Mot de passe incorrect",none:"Aucune donnée",ok:"Payé",late:"En retard",part:"Partiel",ex:"Exonéré",lm:"retard",mo:"mois",err:"Impossible de charger les données",soon:"Les données seront bientôt publiées",toggle:"العربية",mine:"Mon compte",apt:"N° appartement",code:"Code personnel",bad2:"N° d'appartement ou code incorrect",owedl:"Reste à payer",allok:"Tous vos mois sont payés ✅",latel:"Mois en retard",hist:"12 derniers mois",pays:"Vos derniers paiements",leave:"Fermer",left:"Reste",unit:"appt",month:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],cur:"MAD"},en:{up:"Last update",bal:"Current balance",paid:"Paid this month",inc:"Income this month",exp:"Expenses this month",ser:"Income and expenses (12 months)",cat:"Expenses by category (current year)",bud:"Budget vs actual spending",rec:"Latest expenses",tsk:"Upcoming maintenance",elev:"Monthly elevator inspection on day",pay:"How to pay",fee:"Monthly contribution",lock:"Expense details and payment status by apartment",grid:"Payment status by apartment",pw:"Password",open:"Open",bad:"Wrong password",none:"No data",ok:"Paid",late:"Late",part:"Partial",ex:"Exempt",lm:"late",mo:"months",err:"Could not load the data",soon:"The data will be published soon",toggle:"English",unit:"apt",month:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],cur:"MAD",mine:"My account",apt:"Apartment no.",code:"Personal code",bad2:"Wrong apartment number or code",owedl:"Amount due",allok:"All your months are paid ✅",latel:"Late months",hist:"Last 12 months",pays:"Your latest payments",leave:"Close",left:"Left"}};
function t(k){return T[LG][k]}function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(n){return Number(n||0).toLocaleString("en")+" "+t("cur")}
function mn(m){return t("month")[+m.slice(5)-1]+(m.slice(0,4)!=(D&&D.m||"").slice(0,4)?" "+m.slice(2,4):"")}
function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function dec(o,pw){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(o.salt),iterations:o.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.iv)},key,ub(o.data));return new TextDecoder().decode(pt)}
function cn(o){return LG=="ar"?o.c:(LG=="en"?(o.ce||o.cl):o.cl)}
function norm(c){return String(c).toUpperCase().replace(/[^A-Z0-9]/g,"")}
async function myAcct(){var n=document.getElementById("an").value.trim(),code=norm(document.getElementById("ac").value),msg=document.getElementById("am");msg.textContent="";
 if(!/^\d{1,3}$/.test(n)||code.length<8){msg.textContent=t("bad2");return}
 try{var r=await fetch("u/"+n+".json?_="+Date.now());if(!r.ok)throw 0;var o=await r.json();var d=JSON.parse(await dec(o,code));localStorage.setItem("pg_apt",n);window.__acct=d;showAcct(d)}catch(e){msg.textContent=t("bad2")}}
function showAcct(d){var c={p:"#16a34a",l:"#dc2626",h:"#d97706"},nm={p:t("ok"),l:t("late"),h:t("part")};
 var h='<h2>🔑 '+t("mine")+" — "+t("unit")+" "+d.n+'</h2>';
 if(!d.owed)h+='<div style="font-size:18px;font-weight:700;color:var(--g);margin:6px 0">'+t("allok")+'</div>';
 else h+='<small style="color:var(--mu)">'+t("owedl")+'</small><div class="big" style="color:var(--r)">'+fm(d.owed)+'</div><div style="margin-top:8px"><b>'+t("latel")+'</b></div>'+d.late.map(function(x){return'<div class="row"><div class="f">'+mn(x.m)+'</div><b>'+fm(x.r)+'</b></div>'}).join("");
 h+='<div style="margin-top:12px"><b>'+t("hist")+'</b></div><div class="grid" style="grid-template-columns:repeat(6,1fr)">'+d.hist.map(function(x){return'<div style="background:'+c[x.s]+';font-size:12px;padding:6px 0">'+mn(x.m)+'<small>'+nm[x.s]+'</small></div>'}).join("")+'</div>';
 if((d.pays||[]).length)h+='<div style="margin-top:12px"><b>'+t("pays")+'</b></div>'+d.pays.map(function(x){return'<div class="row"><div class="f">'+mn(x.m)+(x.h?" · "+t("part"):"")+'<small>'+x.d+'</small></div><b>'+fm(x.a)+'</b></div>'}).join("");
 h+='<div style="margin-top:12px"><button class="b" id="al">'+t("leave")+'</button></div>';document.getElementById("mine").innerHTML=h;
 document.getElementById("al").onclick=function(){window.__acct=null;render()}}
function render(){document.documentElement.lang=LG;document.documentElement.dir=LG=="ar"?"rtl":"ltr";var lb=document.getElementById("lb");if(!lb.options.length)lb.innerHTML='<option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option>';lb.value=LG;
 if(!D){document.getElementById("ti").textContent="Alia 3";document.getElementById("su").textContent="";document.getElementById("app").innerHTML='<div class="cd">'+t(window.__failed?"err":"soon")+'</div>';return}
 var nm=(LG!="ar"&&D.nameL)||D.name,s=D.series||[],cur=s[s.length-1]||{i:0,e:0},mx=1;s.forEach(function(x){mx=Math.max(mx,x.i,x.e)});
 document.getElementById("ti").textContent=nm;document.getElementById("su").textContent=((LG!="ar"&&D.cityL)||D.city||"")+" · "+t("up")+": "+new Date(D.t).toLocaleDateString(LG=="ar"?"ar-MA":LG=="fr"?"fr-FR":"en-GB");
 var h="";if(D.notice)h+='<div class="note" dir="auto">📢 '+esc(D.notice)+'</div>';
 h+='<div class="kp"><div class="cd hero"><small>'+t("bal")+'</small><div class="big">'+fm(D.bal)+'</div></div><div class="cd"><small>'+t("inc")+'</small><div class="v" style="color:var(--g)">'+fm(cur.i)+'</div></div><div class="cd"><small>'+t("exp")+'</small><div class="v" style="color:var(--r)">'+fm(cur.e)+'</div></div><div class="cd" style="grid-column:1/-1"><small>'+t("paid")+'</small><div class="v">'+D.paidN+" / "+D.actN+'</div><div class="pb"><i style="width:'+(D.actN?D.paidN/D.actN*100:0)+'%;background:var(--y)"></i></div></div></div>';
 h+='<div class="cd"><h2>'+t("ser")+'</h2><div class="ch">'+s.map(function(x){return'<div><div class="bars"><i title="'+fm(x.i)+'" style="height:'+x.i/mx*100+'%;background:var(--g)"></i><i title="'+fm(x.e)+'" style="height:'+x.e/mx*100+'%;background:var(--r)"></i></div>'+t("month")[+x.m.slice(5)-1].slice(0,3)+'</div>'}).join("")+'</div></div>';
 var tot=0;(D.cats||[]).forEach(function(c){tot+=c.x});
 if((D.cats||[]).length){h+='<div class="cd"><h2>'+t("cat")+'</h2>'+D.cats.map(function(c){var p=tot?c.x/tot*100:0;return'<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>'+esc(cn(c))+'</span><b>'+fm(c.x)+'</b></div><div class="pb"><i style="width:'+p+'%;background:var(--pr)"></i></div></div>'}).join("")+'</div>';
  var hb=D.cats.filter(function(c){return c.b>0});if(hb.length)h+='<div class="cd"><h2>'+t("bud")+'</h2>'+hb.map(function(c){var p=c.b?c.x/c.b*100:0;return'<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>'+esc(cn(c))+'</span><small>'+fm(c.x)+" / "+fm(c.b)+'</small></div><div class="pb"><i style="width:'+Math.min(100,p)+'%;background:'+(p>100?"var(--r)":p>80?"var(--y)":"var(--g)")+'"></i></div></div>'}).join("")+'</div>'}
 h+='<div id="exd"></div>';
 if((D.tasks||[]).length||D.elev)h+='<div class="cd"><h2>'+t("tsk")+'</h2>'+(D.elev?'<div class="row"><div class="f">🛗 '+t("elev")+" "+D.elev+'</div></div>':"")+(D.tasks||[]).map(function(k){return'<div class="row"><div class="f" dir="auto">🔧 '+esc(k.n)+'<small>'+k.d+'</small></div></div>'}).join("")+'</div>';
 h+='<div class="cd"><h2>'+t("pay")+'</h2><div>'+t("fee")+': <b>'+fm(D.fee)+'</b></div>'+(D.pay?'<div dir="auto" style="white-space:pre-wrap;margin-top:6px">'+esc(D.pay)+'</div>':"")+'</div>';
 h+='<div class="cd" id="mine"><h2>🔑 '+t("mine")+'</h2><div style="display:flex;gap:8px"><input id="an" inputmode="numeric" placeholder="'+t("apt")+'" value="'+esc(localStorage.getItem("pg_apt")||"")+'" style="width:96px"><input id="ac" placeholder="'+t("code")+'" autocapitalize="characters" autocomplete="off" style="flex:1;min-width:0"><button class="b" id="ab">'+t("open")+'</button></div><div id="am" style="margin-top:8px;color:var(--r)"></div></div>';
 h+='<div class="cd" id="pv"><h2>🔒 '+t("lock")+'</h2><div style="display:flex;gap:8px"><input id="pw" type="password" placeholder="'+t("pw")+'" style="flex:1"><button class="b" id="ob">'+t("open")+'</button></div><div id="pm" style="margin-top:8px;color:var(--r)"></div></div>';
 h+='<div class="upd">Alia 3</div>';document.getElementById("app").innerHTML=h;
 var ab=document.getElementById("ab");if(ab)ab.onclick=myAcct;var aci=document.getElementById("ac");if(aci)aci.onkeydown=function(e){if(e.key=="Enter")myAcct()};if(window.__acct)showAcct(window.__acct);var ob=document.getElementById("ob");if(ob)ob.onclick=unlock;var pwi=document.getElementById("pw");if(pwi)pwi.onkeydown=function(e){if(e.key=="Enter")unlock()};if(window.__priv)showPriv(window.__priv)}
async function unlock(){var pw=document.getElementById("pw").value,pm=document.getElementById("pm");pm.textContent="";
 try{var r=await fetch("private.json?_="+Date.now());if(!r.ok)throw 0;var o=await r.json();var d=JSON.parse(await dec(o,pw));window.__priv=d;showPriv(d)}catch(e){pm.textContent=t("bad")}}
function showPriv(d){var c={p:"#16a34a",l:"#dc2626",h:"#d97706",x:"#6b7280"},n={p:t("ok"),l:t("late"),h:t("part"),x:t("ex")};
 var h='<h2>🔓 '+t("grid")+" — "+mn(d.m)+'</h2><div class="grid">'+d.units.map(function(u){return'<div style="background:'+c[u.s]+'">'+u.n+'<small>'+(u.s=="l"&&u.k>1?u.k+" "+t("mo"):n[u.s])+'</small></div>'}).join("")+'</div><div class="lg">'+["p","h","l","x"].map(function(k){return'<span style="--c:'+c[k]+'">'+n[k]+'</span>'}).join("")+'</div>';
 document.getElementById("pv").innerHTML=h;
 var ex=document.getElementById("exd");if(ex&&d.recent&&d.recent.length){ex.className="cd";ex.innerHTML='<h2>'+t("rec")+'</h2>'+d.recent.map(function(r){return'<div class="row"><div class="f" dir="auto">'+esc(r.t||cn(r))+'<small>'+r.d+" · "+esc(cn(r))+'</small></div><b>'+fm(r.a)+'</b></div>'}).join("")}}
document.getElementById("lb").onchange=function(){LG=this.value;localStorage.setItem("pg_lang",LG);render()};
fetch("data.json?_="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){D=d;render()}).catch(function(){window.__failed=1;render()});
render();
</script></body></html>
